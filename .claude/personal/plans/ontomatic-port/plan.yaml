schema_version: 1
id: ontomatic-port
title: Port Ontomatic to upstream
description: 'Bring Ontomatic (OWL ontology to KRROOD model, ABox loading with OWL 2 RL materialization,
  AAMAS 2027 paper Section 5) from AbdelrhmanBassiouny''s aamas27-experiments branch onto current main
  as a clean rewrite-in-place. Copied from the Ontomatic port track of his ontomatic-port plan. Draft
  PR 25 (ontomatic-on-main) is split into the stacked PRs 27 to 31, which are direct ports; the clean-rewrite
  items are still open.

  '
default_repository: sorinar329/cognitive_robot_abstract_machine
tracking_issue: 26
waves:
- id: port
  name: Port to upstream
  description: Parity with the paper on current main, cleaned up per AGENTS.md.
tracks:
- id: ontomatic-core
  name: Ontomatic port
  wave: port
  description: Descriptors, terminology, compiler, loader, check, verification, experiments.
items:
- id: descriptor-characteristics
  branch: descriptor-characteristics
  title: Property characteristics and chain axioms on upstream property descriptors
  track: ontomatic-core
  depends_on: []
  status: in progress
  notes: Port ontomatic/property_descriptor/mixins.py from aamas27-experiments onto main's descriptors.
    Split from PR 25 (mixins.py, chain registration); upstream PR cram2#892; fork review in sorinar329#27.
  pull_request_number: 892
  repository: cram2/cognitive_robot_abstract_machine
- id: descriptor-provenance
  branch: descriptor-provenance
  title: Inferred facts with provenance and fact placement in PropertyDescriptorRelation
  track: ontomatic-core
  depends_on:
  - descriptor-characteristics
  status: in progress
  notes: 'InferredThrough, premises/explain, equivalence/inverse/symmetry/chain inference. Split from
    PR 25: inference, fact placement, provenance and the descriptor registry. Upstream PR cram2#909; fork
    review in sorinar329#28.'
  pull_request_number: 909
  repository: cram2/cognitive_robot_abstract_machine
- id: terminology-model
  branch: terminology-model
  title: Typed Terminology read from RDF, profile report, explicit domain/range rules
  track: ontomatic-core
  depends_on: []
  status: not_started
  notes: Seed from owl2rl_tbox.py; replaces ClassInfo/PropertyInfo and the rdrs/property_inference files.
- id: abox-loader
  branch: abox-loader
  title: ABox loader as the Algorithm 1 pipeline of step classes
  track: ontomatic-core
  depends_on:
  - owl2rl-consistency-check
  - ontology-code-generation
  - descriptor-provenance
  status: in progress
  notes: 'Fixes: line_profiler, tqdm and timing inside library code. PR 31 is the direct port; the Algorithm
    1 step classes and the removal of tqdm/timing are still open.'
  pull_request_number: 31
- id: owl2rl-consistency-check
  branch: owl2rl-consistency-check
  title: OWL 2 RL equality and consistency check on a rule registry
  track: ontomatic-core
  depends_on:
  - ontology-code-generation
  status: in progress
  pull_request_number: 30
  notes: PR 30 is the direct port; the rule registry is still open.
- id: closure-verification
  branch: closure-verification
  title: Differential tests against owlrl's closure and the 78-rule coverage test
  track: ontomatic-core
  depends_on:
  - owl2rl-consistency-check
  status: not_started
- id: owl2bench-experiments
  branch: owl2bench-experiments
  title: OWL2Bench model generation, queries and closure comparison in experiments/
  track: ontomatic-core
  depends_on:
  - closure-verification
  status: not_started
  notes: From krrood_experiments aamas27-* and the supplement; large runs skipped in CI.

- id: relation-path-unification
  branch: relation-path-unification
  title: Unify RelationPath with the class diagram's AttributeEndpoint
  track: ontomatic-core
  depends_on:
  - descriptor-provenance
  status: not_started
  notes: 'Raised in the review of cram2#909. RelationPath (property_descriptor_relation.py) follows relations
    between instances; AttributeEndpoint (class_diagrams/causal_relation.py, Narenvasant) is the class-level
    path. Proposal: the class-level path says which fields to follow and RelationPath is its result on
    instances. Agreed as a later PR; shape not decided.'

- id: ontology-extraction
  branch: ontology-extraction
  title: Read an ontology's classes and properties into an information model
  track: ontomatic-core
  pull_request_number: 954
  depends_on: []
  status: in progress
  notes: 'Part 1 of 4 replacing PR 29: ClassInfo/PropertyInfo/OntologyInfo, the extractors, NamingRegistry,
    IsSubClassOrRole. Includes the is_functional fix of PR 32. Upstream PR cram2#954; fork review in sorinar329#34.'
  repository: cram2/cognitive_robot_abstract_machine
- id: ontology-axioms
  branch: ontology-axioms
  title: Classification axioms, individuals of inferred classes and property inference
  track: ontomatic-core
  pull_request_number: 35
  depends_on:
  - ontology-extraction
  status: in progress
  notes: 'Part 2 of 4: axioms.py, AnonymousClass, PropertyDomainAndRangeInference, the descriptor registry
    and HasProperty.'

- id: ontology-inference
  branch: ontology-inference
  title: Infer classification conditions and property types over an ontology
  track: ontomatic-core
  pull_request_number: 36
  depends_on:
  - ontology-axioms
  status: in progress
  notes: 'Part 3 of 4: InferenceEngine (about 1200 lines, one class); dividing it by concern is a later
    PR.'

- id: ontology-code-generation
  branch: ontology-code-generation
  title: Generate Python modules from an ontology
  track: ontomatic-core
  pull_request_number: 37
  depends_on:
  - ontology-inference
  status: in progress
  notes: 'Part 4 of 4: CodeGenerator, the templates and OwlToPythonConverter, with the end-to-end tests.
    Still the direct port; terminology-model reshapes it.'
