schema_version: 1
id: hsr-robocasa-experiments
title: HSR RoboCasa experiments, one task at a time
description: Rebuilds the HSR RoboCasa experiments from a clean main, one task after another, all committed
  on the one fork branch hsr-robocasa-integration, with no pull request per task. Changes to core code (krrood,
  semantic_digital_twin, coraplex, giskardpy) are never committed there directly; each is its own branch and
  its own draft pull request into the fork's main, added to this plan when a task first needs it. The user
  opens the pull requests to cram2.
default_repository: sorinar329/cognitive_robot_abstract_machine
tracking_issue: 38
waves:
- id: first-task
  name: 'Wave 1: First task'
  description: The integration branch and the first HSR RoboCasa task, with the core changes it needs.
- id: more-tasks
  name: 'Wave 2: More tasks'
  description: The remaining tasks, chained by difficulty.
tracks:
- id: integration
  name: Integration branch
  wave: first-task
  description: The one fork branch the experiments are committed on.
- id: core
  name: Core changes
  wave: first-task
  description: Draft pull requests into the fork's main that the first experiment needs; each rebuilt
    from main, with the old branch hsr-robocasa-tasks as reference. The user opens the cram2 pull requests.
- id: first-experiment
  name: First experiment
  wave: first-task
  description: The first HSR RoboCasa task, which builds the runner the others reuse.
- id: experiments
  name: Experiments
  wave: more-tasks
  description: The remaining HSR RoboCasa tasks, each committed on hsr-robocasa-integration.
items:
- id: integration-branch
  title: hsr-robocasa-integration, the one fork branch the experiments are committed on
  branch: hsr-robocasa-integration
  track: integration
  pull_request_number: 39
  session: https://claude.ai/code/session_01Meb8t8PxqSfNswMKesfkJp
  depends_on: []
  status: in progress
  notes: 'Fork-only; it never goes upstream, and PR #39 stays a permanent draft. Every task is committed
    straight onto it. Keep it merged with main. Core branches not yet in main are merged into it so the experiments
    can run, and dropped once main has them. Refreshed from main on 2026-11-17 (b1e5a57d2a).'
- id: pick-place-counter-to-cabinet
  title: HSR PickPlaceCounterToCabinet and the RoboCasa task runner
  track: first-experiment
  depends_on:
  - integration-branch
  - robocasa-loader
  - gcs-free-point
  - collision-rule-lookup
  - hsr-arm-reach
  - path-navigation-margin
  - pick-up-lift
  status: not started
  notes: 'First task; builds the runner the later tasks reuse. Committed on hsr-robocasa-integration, with
    no pull request of its own. The old branch hsr-robocasa-tasks is a read-only reference for when something
    goes wrong. Each further core change the task needs becomes its own plan item and draft pull request into
    the fork''s main via /add-plan-item, and this item depends on it.'
- id: pick-place-cabinet-to-counter
  title: HSR PickPlaceCabinetToCounter
  track: experiments
  depends_on:
  - pick-place-counter-to-cabinet
  status: not started
  notes: Committed on hsr-robocasa-integration, with no pull request of its own.
- id: pick-place-counter-to-sink
  title: HSR PickPlaceCounterToSink
  track: experiments
  depends_on:
  - pick-place-cabinet-to-counter
  status: not started
  notes: Committed on hsr-robocasa-integration, with no pull request of its own.
- id: pick-place-sink-to-counter
  title: HSR PickPlaceSinkToCounter, with RoboCasa's verdict on every run
  track: experiments
  depends_on:
  - pick-place-counter-to-sink
  status: not started
  notes: Committed on hsr-robocasa-integration, with no pull request of its own.
- id: pick-place-counter-to-microwave
  title: HSR PickPlaceCounterToMicrowave
  track: experiments
  depends_on:
  - pick-place-sink-to-counter
  status: not started
  notes: Committed on hsr-robocasa-integration, with no pull request of its own.

